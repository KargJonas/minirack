; minirack base image - a minimal RackOTA firmware, serial-flashed into ota_0
; when a board is first commissioned (bootloader + partition table + blank
; otadata + image). Pick the env matching the board on the serial port!
;   pio run -e lolin32 -t upload      dev board (WiFi; ground IO0 to flash)
;   pio run -e wt32-eth01 -t upload   real board (ethernet)
[platformio]
default_envs = lolin32
extra_configs = ../secrets.ini

[env]
platform = espressif32@6.9.0
framework = arduino
board_build.partitions = ../partitions_4mb.csv
monitor_speed = 115200
lib_extra_dirs = ../lib
lib_deps =
    esp32async/AsyncTCP@^3.3.2
    esp32async/ESPAsyncWebServer@^3.7.0
extra_scripts = flash_otadata.py

[env:wt32-eth01]
board = wt32-eth01
build_flags =
    -DRACK_USE_ETH

; The lolin board is supported for development purposes
[env:lolin32]
board = lolin32
build_flags =
    -DRACK_USE_WIFI
    -DRACK_WIFI_SSID='"${secrets.wifi_ssid}"'
    -DRACK_WIFI_PASS='"${secrets.wifi_pass}"'
upload_port = /dev/ttyACM0
monitor_port = /dev/ttyACM0
