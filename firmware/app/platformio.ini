; minirack demo app — a plain Arduino sketch, uploaded over HTTP:
;   pio run -e lolin32
;   curl --data-binary @.pio/build/lolin32/firmware.bin http://<device-ip>/update
[platformio]
default_envs = lolin32
extra_configs = ../secrets.ini

[env]
platform = espressif32@6.9.0
framework = arduino
board_build.partitions = ../partitions_4mb.csv
monitor_speed = 115200
lib_extra_dirs = ../lib

; Development board (WiFi) until the real hardware arrives.
; (LOLIN32 OLED variant, but the OLED panel is dead — don't bother with it.)
[env:lolin32]
board = lolin32
build_flags =
    -DAPP_USE_WIFI
    -DAPP_WIFI_SSID='"${secrets.wifi_ssid}"'
    -DAPP_WIFI_PASS='"${secrets.wifi_pass}"'
monitor_port = /dev/ttyACM0

; The real rack-monitor board (ethernet)
[env:wt32-eth01]
board = wt32-eth01
build_flags =
    -DAPP_USE_ETH
