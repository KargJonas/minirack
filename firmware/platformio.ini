; Minirack firmware (rack-monitor). The real application for the WT32-ETH01
; on the power/monitoring board - built on EasyOTA so it stays updatable and
; inspectable over ethernet.
;
; Build + upload over HTTP (device is discovered via mDNS):
;   ./flash.sh
; Initial serial commissioning of a fresh board is done once with EasyOTA's
; base image (see easy-ota/base), after which everything is OTA.
;
; EasyOTA is vendored as a git submodule under this project at easy-ota/.
; For WiFi dev-board bringup instead of ethernet, see
; easy-ota/examples/clocks.
[platformio]
default_envs = wt32-eth01

[env:wt32-eth01]
platform = espressif32@6.9.0
framework = arduino
board = wt32-eth01
board_build.partitions = easy-ota/partitions_4mb.csv
monitor_speed = 115200
lib_extra_dirs = easy-ota/lib
lib_deps =
    esp32async/AsyncTCP@^3.3.2
    esp32async/ESPAsyncWebServer@^3.7.0
build_flags =
    -DEASYOTA_USE_ETH
