; minirack OTA loader — lives in the "factory" partition, flashed once over serial.
; Accepts app images over HTTP (curl --data-binary) and boots them from ota_0/ota_1.
[platformio]
default_envs = lolin32
extra_configs = ../secrets.ini

[env]
platform = espressif32@6.9.0
framework = espidf
board_build.partitions = ../partitions_4mb.csv
monitor_speed = 115200

; Development board until the real hardware arrives (WiFi instead of ethernet)
[env:lolin32]
board = lolin32
build_flags =
    -DLOADER_USE_WIFI
    -DLOADER_WIFI_SSID='"${secrets.wifi_ssid}"'
    -DLOADER_WIFI_PASS='"${secrets.wifi_pass}"'
upload_port = /dev/ttyACM0
monitor_port = /dev/ttyACM0

; The real rack-monitor board (LAN8720 PHY, 50MHz osc enabled via GPIO16)
[env:wt32-eth01]
board = wt32-eth01
build_flags =
    -DLOADER_USE_ETH
