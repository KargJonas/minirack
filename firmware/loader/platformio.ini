[platformio]
default_envs = lolin32
extra_configs = ../secrets.ini

[env]
platform = espressif32@6.9.0
framework = espidf
board_build.partitions = ../partitions_4mb.csv
monitor_speed = 115200

[env:wt32-eth01]
board = wt32-eth01
build_flags =
    -DLOADER_USE_ETH

; The lolin board is supported for development purposes
[env:lolin32]
board = lolin32
build_flags =
    -DLOADER_USE_WIFI
    -DLOADER_WIFI_SSID='"${secrets.wifi_ssid}"'
    -DLOADER_WIFI_PASS='"${secrets.wifi_pass}"'
upload_port = /dev/ttyACM0
monitor_port = /dev/ttyACM0
