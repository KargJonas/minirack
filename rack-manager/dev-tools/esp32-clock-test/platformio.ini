; ESP32 CLKIN generation test for ADS131M02 (rack-manager)
; Outputs a clock on GPIO14 and lets us measure it with a logic analyzer.
[env:esp32]
platform = espressif32@6.9.0        ; arduino-esp32 2.0.17 / IDF 4.4 (stable I2S + LEDC legacy API)
board = esp32dev                    ; generic ESP32 - pin mapping irrelevant, we only use GPIO14
framework = arduino
monitor_speed = 115200
upload_port = /dev/ttyUSB0
monitor_port = /dev/ttyUSB0
upload_speed = 460800
